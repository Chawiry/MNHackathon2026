[project]
name = "mnhackathon2026"
version = "0.1.0"
description = "Team skill management platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2,<7",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config"]
