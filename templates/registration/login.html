{% extends "base.html" %}

{% block title %}Log in · Team Skills{% endblock %}

{% block content %}
  <div class="max-w-sm mx-auto mt-16 bg-white border border-slate-200 rounded-lg p-6 shadow-sm">
    <h1 class="text-xl font-semibold mb-4">Log in</h1>
    {% if form.errors %}
      <p class="text-sm text-red-600 mb-3">Your username and password didn't match. Try again.</p>
    {% endif %}
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ form.as_div }}
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded py-2 text-sm">Log in</button>
    </form>
    <p class="mt-4 text-sm text-slate-600">
      No account?
      <a href="{% url 'register' %}" class="text-blue-600 hover:underline">Register</a>
    </p>
  </div>
{% endblock %}
