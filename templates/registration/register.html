{% extends "base.html" %}

{% block title %}Register · Team Skills{% endblock %}

{% block content %}
  <div class="max-w-sm mx-auto mt-16 bg-white border border-slate-200 rounded-lg p-6 shadow-sm">
    <h1 class="text-xl font-semibold mb-4">Create an account</h1>
    {% if form.non_field_errors %}
      <p class="text-sm text-red-600 mb-3">{{ form.non_field_errors }}</p>
    {% endif %}
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ form.as_div }}
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded py-2 text-sm">Register</button>
    </form>
    <p class="mt-4 text-sm text-slate-600">
      Already have an account?
      <a href="{% url 'login' %}" class="text-blue-600 hover:underline">Log in</a>
    </p>
  </div>
{% endblock %}
